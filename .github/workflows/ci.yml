name: CI

on:
  pull_request:
    branches: [main, development, staging]
  push:
    branches: [main, development, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: iOS Simulator Tests
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select an available iOS 26 iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "simulators.json").read_text())["devices"]
          for runtime in sorted(devices, reverse=True):
              if "SimRuntime.iOS-26-" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(f"udid={device['udid']}")
                      raise SystemExit(0)
          raise SystemExit("No available iOS 26 iPhone simulator was found.")
          PYCODE
      - name: Boot the selected simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Build and run the existing test target
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test \
            -project Secure-Vault.xcodeproj \
            -scheme Secure-Vault \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/secure-vault-derived" \
            -resultBundlePath "$RUNNER_TEMP/secure-vault-tests.xcresult" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=-
